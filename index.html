<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CentroXpert - Ingeniería y Servicios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <!-- Exportación Excel y PDF -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-rose-900 selection:text-white">

  <!-- ================= TOPBAR ================= -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
        <div class="bg-white px-3 py-1.5 rounded-lg flex items-center shadow-sm">
          <svg viewBox="0 0 280 60" class="h-8 md:h-10 w-auto" xmlns="http://www.w3.org/2000/svg">
            <g font-family="'Ubuntu', 'Arial', sans-serif" font-weight="700" font-size="34" letter-spacing="-1"><text x="2" y="38" fill="#111827">centr</text></g>
            <g transform="translate(103, 9)">
              <circle cx="16" cy="18" r="14" fill="none" stroke="#111827" stroke-width="4.5" stroke-dasharray="72 25" stroke-dashoffset="-7" />
              <line x1="16" y1="3" x2="16" y2="18" stroke="#8b1524" stroke-width="5" stroke-linecap="round" />
            </g>
            <g font-family="'Ubuntu', 'Arial', sans-serif" font-weight="400" font-size="34" letter-spacing="-0.5"><text x="138" y="38" fill="#8b1524">xpert</text></g>
            <text x="2" y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="600" fill="#64748b" letter-spacing="1">SERVICIOS TECNOLOGICOS ESPECIALIZADOS</text>
            <line x1="156" y1="52" x2="275" y2="52" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </div>
        <div class="hidden sm:block border-l border-slate-700 pl-3">
          <div class="text-xs uppercase tracking-widest text-slate-400 font-bold">Ingeniería y Servicios</div>
          <div class="text-sm font-semibold text-rose-400">Control Operativo & Técnico</div>
        </div>
      </div>
      <div class="flex items-center gap-3" id="headerUserActions"></div>
    </div>
  </header>

  <!-- ================= CONTENEDOR PRINCIPAL ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="mainContainer"></main>

  <!-- ================= MODALES ================= -->
  <!-- Modal Login -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="text-center mb-6">
        <h3 class="text-xl font-bold text-white">Ingreso al Sistema v2.0</h3>
        <p class="text-xs text-slate-400 mt-1">Selecciona tu perfil de acceso para continuar</p>
      </div>

      <div class="flex border-b border-slate-800 mb-5">
        <button id="tabLoginTec" onclick="switchLoginTab('tec')" class="flex-1 py-2 font-semibold text-sm border-b-2 border-rose-600 text-rose-400">
          <i class="fa-solid fa-hard-hat mr-1.5"></i> Técnico
        </button>
        <button id="tabLoginAdmin" onclick="switchLoginTab('admin')" class="flex-1 py-2 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-user-shield mr-1.5"></i> Coordinación
        </button>
      </div>

      <form id="formLoginTec" onsubmit="handleTecLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Técnico Asignado</label>
          <select id="loginTecSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">PIN / Contraseña</label>
          <input type="password" id="loginTecPin" required placeholder="••••" maxlength="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500">
        </div>
        <button type="submit" class="w-full bg-rose-700 hover:bg-rose-600 font-bold py-2.5 rounded-xl text-sm transition">Entrar como Técnico</button>
      </form>

      <form id="formLoginAdmin" onsubmit="handleAdminLogin(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Clave de Coordinación (admin123)</label>
          <input type="password" id="loginAdminPass" required placeholder="Clave administrativa" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500">
        </div>
        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-600 font-bold py-2.5 rounded-xl text-sm transition">Entrar a Panel Central</button>
      </form>
    </div>
  </div>

  <!-- Modal Cambiar PIN -->
  <div id="pinModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <!-- Similar al anterior -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-1">Cambiar mi PIN</h3>
      <form onsubmit="handleUpdatePin(event)" class="space-y-3 mt-4">
        <input type="password" id="currentPin" required placeholder="PIN Actual" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        <input type="password" id="newPin" required placeholder="Nuevo PIN" maxlength="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        <input type="password" id="confirmPin" required placeholder="Confirmar PIN" maxlength="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('pinModal')" class="flex-1 bg-slate-800 py-2 rounded-xl text-xs font-semibold">Cancelar</button>
          <button type="submit" class="flex-1 bg-rose-700 text-white py-2 rounded-xl text-xs font-bold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Levantamiento Técnico -->
  <div id="surveyModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full p-6 shadow-2xl my-8">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-4">
        <div>
          <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-clipboard-list mr-2 text-rose-400"></i>Levantamiento Técnico</h3>
          <p class="text-xs text-slate-400" id="surveyProjectTitle">Cargando...</p>
        </div>
        <button onclick="closeModal('surveyModal')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="handleSaveSurvey(event)" class="space-y-4">
        <input type="hidden" id="surveyProjectId">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div><label class="block text-xs font-medium text-slate-300 mb-1">Metros Lineales</label><input type="number" id="surveyMeters" class="w-full bg-slate-800 rounded-xl px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-slate-300 mb-1">Estructura</label><select id="surveyStructure" class="w-full bg-slate-800 rounded-xl px-3 py-2 text-sm"><option>Ductería EMT Existente</option><option>Cielo Raso / Drywall</option><option>Zanja Exterior / Soterrado</option></select></div>
          <div><label class="block text-xs font-medium text-slate-300 mb-1">Energía</label><select id="surveyPower" class="w-full bg-slate-800 rounded-xl px-3 py-2 text-sm"><option>110V Regulada con UPS</option><option>110V Sin Respaldo</option></select></div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Observaciones</label>
          <textarea id="surveyNotes" rows="2" class="w-full bg-slate-800 rounded-xl px-3 py-2 text-sm"></textarea>
        </div>

        <!-- Archivos Adjuntos (Fotos, PDF, Excel) -->
        <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
          <label class="block text-xs font-bold text-blue-400 mb-2"><i class="fa-solid fa-paperclip mr-1"></i>Adjuntar Archivos (Foto, PDF, Excel)</label>
          <input type="file" id="surveyFilesInput" multiple accept="image/*,.pdf,.xlsx,.xls" onchange="handleSurveyFilesSelected(event)" class="text-xs text-slate-400">
          <div id="surveyFilesList" class="mt-2 text-xs space-y-1"></div>
        </div>

        <!-- Tienda -->
        <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800">
          <div class="flex gap-2 mb-2">
            <input type="text" id="omegaSearchInput" placeholder="Buscar en tienda..." class="flex-1 bg-slate-800 rounded-lg px-2 py-1 text-xs">
            <button type="button" onclick="searchOmegaCatalog()" class="bg-blue-700 px-3 py-1 rounded-lg text-xs font-semibold">Buscar</button>
          </div>
          <div id="omegaResults" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-32 overflow-y-auto"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-800/50 p-2 rounded-xl text-xs"><h4 class="font-bold text-rose-400">Equipos</h4><div id="surveyEquipList"></div></div>
          <div class="bg-slate-800/50 p-2 rounded-xl text-xs"><h4 class="font-bold text-amber-400">Materiales</h4><div id="surveyMaterialList"></div></div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeModal('surveyModal')" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-semibold">Cerrar</button>
          <button type="submit" class="bg-rose-700 px-5 py-2 rounded-xl text-xs font-bold shadow-lg">Guardar Levantamiento</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* ===================================================================
       ESTADO CENTRAL DE LA APLICACIÓN
       =================================================================== */
    const STORAGE_KEY = 'centroxpert_data_v2';
    
    // Si necesitas resetear la app y borrar datos viejos de la version 1: localStorage.removeItem('centroxpert_data_v1');

    const defaultData = {
      currentUser: { role: 'admin', name: 'Coordinador General' },
      technicians: [
        { id: 'T1', name: 'Enmanuel Matos', level: 'Especialista A', phone: '829-555-0192', address: 'Av. Las Palmas', vehiclePlate: 'L428901', pin: '1234' },
        { id: 'T2', name: 'WESLY MOJICA', level: 'Especialista B', phone: '809-555-0144', address: 'C/ Duarte', vehiclePlate: 'L389104', pin: '1234' }
      ],
      vehicles: [
        { id: 'V1', plate: 'L428901', model: 'Toyota Hilux 2021', assignedTo: 'Enmanuel Matos', status: 'Operativo', odo: 48520 },
        { id: 'V2', plate: 'L389104', model: 'Nissan Frontier 2019', assignedTo: 'WESLY MOJICA', status: 'Operativo', odo: 74210 }
      ],
      tools: [
        { id: 'H1', code: 'TL-01', name: 'Fusionadora de Fibra', assignedTo: 'Enmanuel Matos', condition: 'Excelente' },
        { id: 'H2', code: 'TL-02', name: 'Certificador de Red Fluke', assignedTo: '', condition: 'Excelente' }
      ],
      fuelLogs: [],
      projects: [
        {
          id: 'P1', code: 'CX-SGE-2026-005', title: 'CAMARAS CONDOMINIO', serviceType: 'INSTALACIÓN', client: 'TORRE WASHINGTON',
          contact: 'Ana Milagros (829) 762-8952', address: 'Torre Washington, El Malecón', plannedDate: '26/10/2026',
          techLeader: 'Enmanuel Matos', techCrew: ['WESLY MOJICA'], status: 'Levantamiento',
          survey: { meters: 160, structure: 'Ductería EMT', power: '110V', notes: '', equipment: [], materials: [], files: [] },
          budget: { approved: false, services: [], materials: [], quotationFile: null },
          tracking: { checkIn: '', checkOut: '', hoursWorked: '' }
        }
      ]
    };

    let appData = loadData();
    let tempSurveyFilesList = [];

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
    }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); render(); }

    /* Catálogo Omega Tech precargado */
    const omegaProducts = [
      { sku: 'CAM-HIK-4MP', name: 'Cámara IP Domo 4MP Hikvision', category: 'Equipos', priceRD: 5200 },
      { sku: 'NVR-HIK-16CH', name: 'NVR 16 Canales 4K PoE Hikvision', category: 'Equipos', priceRD: 18500 },
      { sku: 'CAB-UTP-CAT6', name: 'Bobina UTP Cat6 305m Exterior', category: 'Materiales', priceRD: 7900 }
    ];

    let currentNavTab = 'projects';
    let currentLogisticsSubtab = 'vehicles';
    let currentTechTab = 'my_tasks';

    function goHome() { render(); }

    function switchLoginTab(type) {
      document.getElementById('formLoginTec').classList.toggle('hidden', type === 'admin');
      document.getElementById('formLoginAdmin').classList.toggle('hidden', type === 'tec');
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function handleTecLogin(e) {
      e.preventDefault();
      const techName = document.getElementById('loginTecSelect').value;
      const pin = document.getElementById('loginTecPin').value;
      const tech = appData.technicians.find(t => t.name === techName);
      if (tech && (tech.pin === pin || pin === '1234')) {
        appData.currentUser = { role: 'tech', name: tech.name, techId: tech.id };
        closeModal('loginModal'); saveData();
      } else alert('PIN incorrecto. (Por defecto 1234)');
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      if (document.getElementById('loginAdminPass').value === 'admin123') {
        appData.currentUser = { role: 'admin', name: 'Coordinador General' };
        closeModal('loginModal'); saveData();
      } else alert('Clave incorrecta (admin123)');
    }

    function logout() {
      openModal('loginModal');
      const s = document.getElementById('loginTecSelect');
      if (s) s.innerHTML = appData.technicians.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
    }

    /* ========================= VISTAS ========================= */
    function render() {
      document.getElementById('headerUserActions').innerHTML = `
        <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-bold">
          <i class="fa-solid fa-user"></i> ${appData.currentUser.name}
        </div>
        <button onclick="logout()" class="p-2 bg-slate-800 rounded text-slate-300 hover:text-white"><i class="fa-solid fa-power-off"></i></button>
      `;
      document.getElementById('mainContainer').innerHTML = appData.currentUser.role === 'tech' ? renderTechView() : renderAdminView();
    }

    /* --- TECNICO --- */
    function renderTechView() {
      const myTechName = appData.currentUser.name;
      const myProjects = appData.projects.filter(p => p.techLeader === myTechName || p.techCrew.includes(myTechName));
      
      return `
        <div class="space-y-4">
          <h2 class="text-xl font-bold border-b border-slate-800 pb-2">Mis Asignaciones</h2>
          ${myProjects.map(p => `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
              <div class="flex justify-between"><h3 class="font-bold text-rose-400">${p.code} - ${p.title}</h3><span class="text-xs px-2 py-1 bg-slate-800 rounded">${p.status}</span></div>
              <p class="text-xs text-slate-400">📍 ${p.address}</p>
              
              <div class="flex gap-2 pt-2">
                <button onclick="registerTime('${p.id}', 'checkIn')" class="bg-blue-800 text-xs px-3 py-2 rounded flex-1"><i class="fa-solid fa-clock mr-1"></i> Llegada</button>
                <button onclick="registerTime('${p.id}', 'checkOut')" class="bg-amber-800 text-xs px-3 py-2 rounded flex-1"><i class="fa-solid fa-clock mr-1"></i> Salida</button>
                <button onclick="openSurveyModal('${p.id}')" class="bg-rose-700 text-xs font-bold px-3 py-2 rounded flex-1">Levantamiento</button>
              </div>
            </div>
          `).join('') || '<p class="text-slate-400 italic">No tienes proyectos asignados actualmente.</p>'}
        </div>
      `;
    }

    function registerTime(id, type) {
      const p = appData.projects.find(x => x.id === id);
      const now = new Date().toLocaleTimeString();
      if(type === 'checkIn') { p.tracking.checkIn = now; p.status = 'En Curso'; }
      if(type === 'checkOut') { p.tracking.checkOut = now; }
      saveData();
      alert('Hora registrada: ' + now);
    }

    /* --- LEVANTAMIENTO --- */
    let tempSurveyEquip = [], tempSurveyMat = [];
    function openSurveyModal(id) {
      currentSurveyProjectId = id;
      const p = appData.projects.find(x => x.id === id);
      document.getElementById('surveyProjectId').value = id;
      document.getElementById('surveyProjectTitle').innerText = p.title;
      tempSurveyEquip = [...(p.survey.equipment || [])];
      tempSurveyMat = [...(p.survey.materials || [])];
      tempSurveyFilesList = [...(p.survey.files || [])];
      renderSurveyFilesList();
      openModal('surveyModal');
    }

    function handleSurveyFilesSelected(e) {
      const files = Array.from(e.target.files);
      files.forEach(f => tempSurveyFilesList.push({ name: f.name, size: (f.size/1024).toFixed(1) + ' KB' }));
      renderSurveyFilesList();
    }
    
    function renderSurveyFilesList() {
      document.getElementById('surveyFilesList').innerHTML = tempSurveyFilesList.map((f, i) => 
        `<div class="flex justify-between bg-slate-900 px-2 py-1 rounded text-slate-300"><span>📄 ${f.name}</span> <span class="text-rose-400 cursor-pointer" onclick="tempSurveyFilesList.splice(${i},1); renderSurveyFilesList();">&times;</span></div>`
      ).join('');
    }

    function searchOmegaCatalog() {
      const q = document.getElementById('omegaSearchInput').value.toLowerCase();
      document.getElementById('omegaResults').innerHTML = omegaProducts.filter(p => p.name.toLowerCase().includes(q))
        .map(r => `<div class="bg-slate-900 p-2 rounded text-xs mb-1 flex justify-between"><span>${r.name}</span><button type="button" onclick="addOmega('${r.sku}')" class="text-blue-400 font-bold">+ Add</button></div>`).join('');
    }
    function addOmega(sku) {
      const p = omegaProducts.find(x => x.sku === sku);
      if(p.category === 'Equipos') tempSurveyEquip.push(p.name); else tempSurveyMat.push(p.name);
      renderSurveyItems();
    }
    function renderSurveyItems() {
      document.getElementById('surveyEquipList').innerHTML = tempSurveyEquip.map(x => `<div class="mb-1 bg-slate-900 px-1 rounded">${x}</div>`).join('');
      document.getElementById('surveyMaterialList').innerHTML = tempSurveyMat.map(x => `<div class="mb-1 bg-slate-900 px-1 rounded">${x}</div>`).join('');
    }

    function handleSaveSurvey(e) {
      e.preventDefault();
      const p = appData.projects.find(x => x.id === currentSurveyProjectId);
      p.survey = {
        meters: document.getElementById('surveyMeters').value,
        structure: document.getElementById('surveyStructure').value,
        notes: document.getElementById('surveyNotes').value,
        equipment: tempSurveyEquip, materials: tempSurveyMat, files: tempSurveyFilesList
      };
      p.status = 'En Presupuesto';
      closeModal('surveyModal'); saveData();
    }

    /* --- ADMIN / COORDINADOR --- */
    function renderAdminView() {
      return `
        <div class="space-y-4">
          <div class="flex gap-2 border-b border-slate-800 pb-2">
            <button onclick="currentNavTab='projects'; render()" class="px-4 py-2 font-bold rounded ${currentNavTab==='projects'?'bg-rose-700 text-white':'bg-slate-800 text-slate-400'}">Proyectos</button>
            <button onclick="currentNavTab='logistics'; render()" class="px-4 py-2 font-bold rounded ${currentNavTab==='logistics'?'bg-rose-700 text-white':'bg-slate-800 text-slate-400'}">Logística & Equipos</button>
          </div>
          ${currentNavTab === 'projects' ? renderAdminProjects() : renderAdminLogistics()}
        </div>
      `;
    }

    function renderAdminProjects() {
      return appData.projects.map(p => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-4 shadow">
          <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
            <div>
              <span class="text-xs font-mono bg-rose-950 text-rose-400 px-2 py-0.5 rounded">${p.code}</span>
              <h3 class="font-bold mt-1">${p.title}</h3>
            </div>
            <button onclick="editProjectReassign('${p.id}')" class="text-xs bg-slate-800 px-3 py-1 rounded hover:bg-slate-700"><i class="fa-solid fa-pencil text-rose-400 mr-1"></i>Editar Técnico</button>
          </div>
          <div class="grid grid-cols-2 gap-4 text-xs">
            <div><span class="text-slate-400">Responsable:</span> <span class="font-bold text-blue-400">${p.techLeader}</span></div>
            <div><span class="text-slate-400">Estatus:</span> <span class="font-bold text-amber-400">${p.status}</span></div>
          </div>
          
          <div class="bg-slate-950 p-2 rounded mt-3 text-xs border border-slate-800 flex justify-between">
            <div><span class="text-slate-400">🕒 Llegada:</span> <span class="text-emerald-400 font-mono">${p.tracking.checkIn || 'Pendiente'}</span></div>
            <div><span class="text-slate-400">Salida:</span> <span class="text-amber-400 font-mono">${p.tracking.checkOut || 'Pendiente'}</span></div>
          </div>

          <div class="bg-slate-800/40 p-3 rounded mt-3 text-xs">
             <div class="flex justify-between items-center mb-2">
               <h4 class="font-bold text-rose-300">Levantamiento & Archivos:</h4>
             </div>
             ${p.survey && p.survey.files && p.survey.files.length ? 
               p.survey.files.map(f => `<div class="text-blue-300"><i class="fa-solid fa-file mr-1"></i>${f.name} (${f.size}) <a href="#" onclick="alert('Descargando archivo simulado...')" class="ml-2 underline">Descargar</a></div>`).join('') 
               : '<span class="text-slate-500 italic">No hay archivos adjuntos.</span>'
             }
          </div>

          <div class="bg-slate-800/80 p-3 rounded mt-3 text-xs flex justify-between items-center">
            <div>
              <h4 class="font-bold text-emerald-400">Cotización Final:</h4>
              ${p.budget && p.budget.quotationFile ? `<span class="text-white">${p.budget.quotationFile.name} (${p.budget.quotationFile.date})</span>` : '<span class="text-slate-400">Ninguna cargada</span>'}
            </div>
            <button onclick="uploadQuotationSimulate('${p.id}')" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded font-bold"><i class="fa-solid fa-file-invoice-dollar mr-1"></i>Cargar Cotización</button>
          </div>
        </div>
      `).join('');
    }

    function editProjectReassign(id) {
      const p = appData.projects.find(x => x.id === id);
      const techList = appData.technicians.map(t => t.name).join('\n');
      const newTech = prompt(`Técnico actual: ${p.techLeader}\nNuevo técnico asignado:\n${techList}`, p.techLeader);
      if(newTech) { p.techLeader = newTech.trim(); saveData(); alert('Proyecto reasignado. Desaparecerá del técnico anterior.'); }
    }

    function uploadQuotationSimulate(id) {
      const p = appData.projects.find(x => x.id === id);
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.pdf,.xlsx';
      input.onchange = e => {
        if(e.target.files[0]) {
          p.budget.quotationFile = { name: e.target.files[0].name, date: new Date().toLocaleDateString() };
          saveData();
          alert('Cotización adjuntada correctamente.');
        }
      };
      input.click();
    }

    /* --- ADMIN LOGÍSTICA EXPORT / EDIT / DELETE --- */
    function renderAdminLogistics() {
      return `
        <div class="flex gap-2 border-b border-slate-800 pb-2 mb-4">
          <button onclick="currentLogisticsSubtab='vehicles'; render()" class="px-4 py-2 font-bold text-xs rounded ${currentLogisticsSubtab==='vehicles'?'bg-slate-700 text-white':'text-slate-400'}">Vehículos</button>
          <button onclick="currentLogisticsSubtab='tools'; render()" class="px-4 py-2 font-bold text-xs rounded ${currentLogisticsSubtab==='tools'?'bg-slate-700 text-white':'text-slate-400'}">Herramientas</button>
        </div>

        <div class="flex justify-end gap-2 mb-3">
           <button onclick="importExcel()" class="bg-blue-800 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-file-import mr-1"></i>Importar Excel</button>
           <button onclick="exportExcel('${currentLogisticsSubtab}')" class="bg-emerald-700 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-file-excel mr-1"></i>Exportar Excel</button>
           <button onclick="exportPDF('${currentLogisticsSubtab}')" class="bg-rose-700 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-file-pdf mr-1"></i>Exportar PDF</button>
        </div>

        <div class="bg-slate-900 rounded-xl overflow-hidden shadow border border-slate-800">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-950 text-slate-400">
              ${currentLogisticsSubtab === 'vehicles' ? 
                `<tr><th class="p-3">Placa</th><th class="p-3">Modelo</th><th class="p-3">Custodio</th><th class="p-3 text-right">Acciones</th></tr>` :
                `<tr><th class="p-3">Código</th><th class="p-3">Herramienta</th><th class="p-3">Custodio</th><th class="p-3 text-right">Acciones</th></tr>`
              }
            </thead>
            <tbody class="divide-y divide-slate-800">
              ${currentLogisticsSubtab === 'vehicles' ? 
                appData.vehicles.map(v => `<tr><td class="p-3 font-mono">${v.plate}</td><td class="p-3">${v.model}</td><td class="p-3 text-blue-400">${v.assignedTo||'N/A'}</td><td class="p-3 text-right"><button onclick="editItem('vehicle','${v.id}')" class="text-amber-400 mr-2"><i class="fa-solid fa-pencil"></i></button><button onclick="deleteItem('vehicle','${v.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('') :
                appData.tools.map(t => `<tr><td class="p-3 font-mono">${t.code}</td><td class="p-3">${t.name}</td><td class="p-3 text-blue-400">${t.assignedTo||'N/A'}</td><td class="p-3 text-right"><button onclick="editItem('tool','${t.id}')" class="text-amber-400 mr-2"><i class="fa-solid fa-pencil"></i></button><button onclick="deleteItem('tool','${t.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')
              }
            </tbody>
          </table>
        </div>
      `;
    }

    function editItem(type, id) {
      if(type === 'vehicle') {
        const v = appData.vehicles.find(x => x.id === id);
        const p = prompt('Editar Placa:', v.plate); if(!p) return;
        const m = prompt('Editar Modelo:', v.model); if(!m) return;
        v.plate = p.toUpperCase(); v.model = m;
      } else {
        const t = appData.tools.find(x => x.id === id);
        const c = prompt('Editar Código:', t.code); if(!c) return;
        const n = prompt('Editar Nombre:', t.name); if(!n) return;
        t.code = c.toUpperCase(); t.name = n;
      }
      saveData();
    }

    function deleteItem(type, id) {
      if(!confirm('¿Eliminar este registro permanentemente?')) return;
      if(type === 'vehicle') appData.vehicles = appData.vehicles.filter(x => x.id !== id);
      if(type === 'tool') appData.tools = appData.tools.filter(x => x.id !== id);
      saveData();
    }

    function exportExcel(type) {
      const data = type === 'vehicles' ? appData.vehicles : appData.tools;
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Datos");
      XLSX.writeFile(wb, `CentroXpert_${type}.xlsx`);
    }

    function exportPDF(type) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text(`Inventario de ${type === 'vehicles' ? 'Vehículos' : 'Herramientas'}`, 14, 15);
      
      const head = type === 'vehicles' ? [['Placa', 'Modelo', 'Odómetro', 'Custodio']] : [['Código', 'Nombre', 'Custodio', 'Condición']];
      const body = type === 'vehicles' ? appData.vehicles.map(v => [v.plate, v.model, v.odo, v.assignedTo||'N/A']) : appData.tools.map(t => [t.code, t.name, t.assignedTo||'N/A', t.condition]);
      
      doc.autoTable({ startY: 20, head, body });
      doc.save(`CentroXpert_${type}.pdf`);
    }

    function importExcel() {
       alert("Funcionalidad de carga simulada: En un entorno de producción, aquí se procesaría el ArrayBuffer con SheetJS para agregar vehículos/herramientas a la matriz de datos.");
    }

    window.addEventListener('DOMContentLoaded', () => { logout(); });
  </script>
</body>
</html>

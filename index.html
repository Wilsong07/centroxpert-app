<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centroxpert - Coordinación & Órdenes</title>
  <!-- PDF.js para lectura de cotizaciones en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #004b93;
      --secondary: #e30613;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #222;
      --border: #dcdcdc;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
    }
    h2, h3 { margin-top: 0; color: var(--primary); }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    label { font-weight: bold; font-size: 13px; }
    input, select, button {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background-color: var(--primary);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover { background-color: #00366b; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      background-color: #6c757d;
    }
    .badge.pendiente { background-color: #f39c12; }
    .badge.completado { background-color: #27ae60; }
    .badge.cotizado { background-color: #2980b9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: #f0f2f5; }
    .resumen-caja {
      background: #eef6ff;
      border-left: 4px solid var(--primary);
      padding: 12px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .detalle-items {
      margin-top: 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- MÓDULO 1: TÉCNICO (Carga y Actualización de Tarea) -->
  <div class="card">
    <h2>1. Módulo Técnico: Registrar / Actualizar Tarea</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div class="form-group">
        <label>ID Proyecto:</label>
        <input type="text" id="tec_proyecto" placeholder="Ej: PRJ-101" value="PRJ-101" />
      </div>
      <div class="form-group">
        <label>Orden / Tarea #:</label>
        <input type="text" id="tec_orden" placeholder="Ej: ORD-001" />
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div class="form-group">
        <label>Técnico Responsable:</label>
        <input type="text" id="tec_nombre" placeholder="Nombre del técnico" />
      </div>
      <div class="form-group">
        <label>Estatus de la Orden:</label>
        <select id="tec_estatus">
          <option value="Asignada">Asignada</option>
          <option value="En Ruta">En Ruta</option>
          <option value="En Progreso">En Progreso</option>
          <option value="Levantamiento Realizado">Levantamiento Realizado</option>
          <option value="Finalizada">Finalizada</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Comprobante / Archivo de Levantamiento:</label>
      <input type="file" id="tec_archivo" />
    </div>
    <button onclick="guardarOrdenTecnico()">Guardar / Sincronizar Orden</button>
  </div>

  <!-- MÓDULO 2: TABLERO DE PROYECTOS UNIFICADOS -->
  <div class="card">
    <h2>2. Tablero de Proyectos (Vista Unificada)</h2>
    <table id="tabla_proyectos">
      <thead>
        <tr>
          <th>Proyecto</th>
          <th>Total Tareas</th>
          <th>Estatus Unificado</th>
          <th>Servicios (80682)</th>
          <th>Materiales (80687)</th>
          <th>Total Cotizado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- MÓDULO 3: COORDINADOR GENERAL (Carga y Lectura de Cotización Omegatech) -->
  <div class="card" id="modulo_coordinador">
    <h2>3. Módulo Coordinador: Cargar Cotización Omegatech</h2>
    <div class="form-group">
      <label>Seleccionar Proyecto a Cotizar:</label>
      <select id="coord_proyecto_select" onchange="verificarHabilitacionCotizacion()"></select>
    </div>
    <div class="form-group">
      <label>Subir Cotización (PDF Omegatech):</label>
      <input type="file" id="coord_pdf" accept="application/pdf" disabled />
    </div>
    <div id="resultado_extraccion" class="resumen-caja" style="display: none;"></div>
  </div>

</div>

<script>
  // Configuración worker de PDF.js
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let tareas = [];
  let proyectos = {
    "PRJ-101": {
      id: "PRJ-101",
      estatus: "En Espera de Levantamiento",
      servicios: 0,
      materiales: 0,
      total: 0,
      pedidoOmegatech: null
    }
  };

  function renderizarProyectos() {
    const tbody = document.querySelector("#tabla_proyectos tbody");
    tbody.innerHTML = "";
    const selectCoord = document.getElementById("coord_proyecto_select");
    selectCoord.innerHTML = '<option value="">-- Seleccione un proyecto --</option>';

    for (let pId in proyectos) {
      const p = proyectos[pId];
      const tareasProyecto = tareas.filter(t => t.proyecto === pId);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${p.id}</strong></td>
        <td>${tareasProyecto.length}</td>
        <td><span class="badge ${p.estatus.includes('Completado') || p.estatus.includes('Listo') ? 'completado' : (p.estatus.includes('Cotizado') ? 'cotizado' : 'pendiente')}">${p.estatus}</span></td>
        <td>RD$ ${p.servicios.toLocaleString('es-DO', {minimumFractionDigits: 2})}</td>
        <td>RD$ ${p.materiales.toLocaleString('es-DO', {minimumFractionDigits: 2})}</td>
        <td><strong>RD$ ${p.total.toLocaleString('es-DO', {minimumFractionDigits: 2})}</strong></td>
      `;
      tbody.appendChild(tr);

      const opt = document.createElement("option");
      opt.value = pId;
      opt.textContent = `${pId} (${p.estatus})`;
      selectCoord.appendChild(opt);
    }
  }

  function guardarOrdenTecnico() {
    const proyectoId = document.getElementById("tec_proyecto").value.trim().toUpperCase();
    const ordenId = document.getElementById("tec_orden").value.trim();
    const tecnico = document.getElementById("tec_nombre").value.trim();
    const estatus = document.getElementById("tec_estatus").value;
    const archivo = document.getElementById("tec_archivo").files[0];

    if (!proyectoId || !ordenId) {
      alert("Por favor complete el ID de Proyecto y el número de orden.");
      return;
    }

    if (!proyectos[proyectoId]) {
      proyectos[proyectoId] = {
        id: proyectoId,
        estatus: "En Progreso",
        servicios: 0,
        materiales: 0,
        total: 0,
        pedidoOmegatech: null
      };
    }

    const indexExistente = tareas.findIndex(t => t.id === ordenId && t.proyecto === proyectoId);
    const tieneLevantamiento = (estatus === "Levantamiento Realizado" || archivo != null);

    const ordenData = {
      id: ordenId,
      proyecto: proyectoId,
      tecnico: tecnico,
      estatus: estatus,
      levantamientoListo: tieneLevantamiento
    };

    if (indexExistente >= 0) {
      tareas[indexExistente] = ordenData;
    } else {
      tareas.push(ordenData);
    }

    const tareasProyecto = tareas.filter(t => t.proyecto === proyectoId);
    const todosConLevantamiento = tareasProyecto.length > 0 && tareasProyecto.every(t => t.levantamientoListo);

    if (todosConLevantamiento && proyectos[proyectoId].estatus !== "Cotización Procesada") {
      proyectos[proyectoId].estatus = "Listo para Cotización";
    }

    alert(`Orden ${ordenId} sincronizada con éxito en ${proyectoId}.`);
    renderizarProyectos();
    verificarHabilitacionCotizacion();
  }

  function verificarHabilitacionCotizacion() {
    const proyectoSeleccionado = document.getElementById("coord_proyecto_select").value;
    const fileInput = document.getElementById("coord_pdf");

    if (proyectoSeleccionado && proyectos[proyectoSeleccionado]) {
      const p = proyectos[proyectoSeleccionado];
      if (p.estatus === "Listo para Cotización" || p.estatus === "Cotización Procesada") {
        fileInput.removeAttribute("disabled");
        return;
      }
    }
    fileInput.setAttribute("disabled", "true");
  }

  document.getElementById("coord_pdf").addEventListener("change", async function (e) {
    const file = e.target.files[0];
    const proyectoId = document.getElementById("coord_proyecto_select").value;

    if (!file || !proyectoId) return;

    const fileReader = new FileReader();
    fileReader.onload = async function () {
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;

      let lineasTotales = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        
        // Agrupar elementos por línea vertical (coordenada Y aproximada)
        let lineasMap = {};
        for (let item of textContent.items) {
          let y = Math.round(item.transform[5]);
          if (!lineasMap[y]) lineasMap[y] = [];
          lineasMap[y].push(item.str);
        }
        // Orden descendente de Y
        let sortedY = Object.keys(lineasMap).sort((a,b) => b - a);
        for (let y of sortedY) {
          lineasTotales.push(lineasMap[y].join(" "));
        }
      }

      procesarCotizacionPorCodigos(lineasTotales, proyectoId);
    };
    fileReader.readAsArrayBuffer(file);
  });

  function procesarCotizacionPorCodigos(lineas, proyectoId) {
    let servicios = 0;
    let materiales = 0;
    let totalGeneral = 0;
    let pedido = "No identificado";
    let textoCompleto = lineas.join(" ");

    // Extraer número de pedido
    let matchPedido = textoCompleto.match(/PEDIDO\s*#?:?\s*\|?\s*(\d+)/i);
    if (matchPedido) {
      pedido = matchPedido[1];
    }

    // Extraer Total General
    let matchTotal = textoCompleto.match(/TOTAL:?\s*\|?\s*(?:RD\$)?\s*([\d,]+\.\d{2})/i);
    if (matchTotal) {
      totalGeneral = parseFloat(matchTotal[1].replace(/,/g, ""));
    }

    // Recorrer líneas buscando ítems por código (80682: Servicios, 80687: Materiales)
    // O por descripción complementaria
    for (let linea of lineas) {
      let montos = linea.match(/[\d,]+\.\d{2}/g);
      if (!montos || montos.length === 0) continue;

      let importeLinea = parseFloat(montos[montos.length - 1].replace(/,/g, ""));

      // Detección de Servicios Profesionales (Código 80682 o texto clave)
      if (linea.includes("80682") || linea.includes("CX-SRV-") || linea.includes("SERVICIOS PROFESIONALES")) {
        servicios += importeLinea;
      }
      // Detección de Materiales (Código 80687 o afines)
      else if (linea.includes("80687") || linea.includes("MATERIALES") || linea.includes("EQUIPO")) {
        materiales += importeLinea;
      }
    }

    // Si los montos específicos no sumaron el total o fue cotización directa monotasa
    if (servicios === 0 && materiales === 0 && totalGeneral > 0) {
      if (textoCompleto.includes("80682") || textoCompleto.includes("SERVICIOS")) {
        servicios = totalGeneral;
      } else {
        materiales = totalGeneral;
      }
    } else if (totalGeneral > 0 && (servicios + materiales) < totalGeneral) {
      // Si detectó uno pero el otro no tenía código explícito por línea
      if (servicios > 0 && materiales === 0) {
        materiales = Math.max(0, totalGeneral - servicios);
      } else if (materiales > 0 && servicios === 0) {
        servicios = Math.max(0, totalGeneral - materiales);
      }
    }

    if (totalGeneral === 0) {
      totalGeneral = servicios + materiales;
    }

    // Actualizar registro de proyecto
    proyectos[proyectoId].servicios = servicios;
    proyectos[proyectoId].materiales = materiales;
    proyectos[proyectoId].total = totalGeneral;
    proyectos[proyectoId].pedidoOmegatech = pedido;
    proyectos[proyectoId].estatus = "Cotización Procesada";

    // Mostrar resultado
    const resDiv = document.getElementById("resultado_extraccion");
    resDiv.style.display = "block";
    resDiv.innerHTML = `
      <strong>Cotización Omegatech Procesada:</strong><br>
      • Pedido #: <strong>${pedido}</strong><br>
      • Servicios Profesionales (Ítem 80682): <strong>RD$ ${servicios.toLocaleString('es-DO', {minimumFractionDigits: 2})}</strong><br>
      • Materiales (Ítem 80687): <strong>RD$ ${materiales.toLocaleString('es-DO', {minimumFractionDigits: 2})}</strong><br>
      • Total General: <strong>RD$ ${totalGeneral.toLocaleString('es-DO', {minimumFractionDigits: 2})}</strong>
    `;

    renderizarProyectos();
  }

  renderizarProyectos();
</script>

</body>
</html>
